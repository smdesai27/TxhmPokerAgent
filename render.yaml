services:
  - type: web
    name: txhm-poker-api
    runtime: docker
    plan: free
    envVars:
      - key: CHECKPOINT_PATH
        value: checkpoints/serving_champion.pt
      - key: CHECKPOINT_LABEL
        value: "Stage D FCHPA 21k champion (passes all eval gates)"
      - key: GAME_MODE
        value: fchpa
      - key: BOT_POLICY
        value: sample
      - key: POLICY_TEMPERATURE
        value: "1.0"
      - key: CORS_ORIGINS
        sync: false  # Set manually after Vercel deploy to the Vercel URL
