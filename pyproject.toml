[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-rl-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<2.0",
    "torch>=2.1",
    "open_spiel>=1.2.0",
    "PyYAML>=6.0",
    "wandb>=0.15.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]
serving = ["fastapi", "uvicorn[standard]"]

[tool.setuptools.packages.find]
include = ["poker_rl_agent*"]
