# S7 "strong head-to-head" GPU-scaled run: warm-start the FCHPA champion and train at scale with the
# vectorized collector (S1) + corrected PFSP (S3) + Trinal-Clip (S4). Two presets: a short canary to
# gate the full stack on GPU + measure iters/min, and the full multi-day run. WANDB offline (no key).
