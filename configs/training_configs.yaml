default:
  GAME_NAME: "universal_poker"
  ENV_PRESET: "hunl_fcpa"
  BETTING_ABSTRACTION: "fcpa"
  STRICT_ABSTRACTION: true

  ALGO: "ppo_ksp"
  CFR_ITERATIONS: 2000
  ROLLOUT_EPISODES: 64
  PPO_EPOCHS: 2
  PPO_MINIBATCH_SIZE: 256
  PPO_CLIP_EPS: 0.2
  PPO_GAMMA: 0.995
  PPO_GAE_LAMBDA: 0.95
  PPO_VALUE_COEF: 0.25
  PPO_ENTROPY_COEF: 0.003
  PPO_TARGET_KL: 0.015
  PPO_ADV_CLIP: 5.0
  PPO_ADAPTIVE_KL_ENABLE: false
  PPO_ADAPTIVE_KL_HIGH: 2.0
  PPO_ADAPTIVE_KL_LOW: 0.5
  PPO_ADAPTIVE_LR_DECAY: 0.5
  PPO_ADAPTIVE_LR_GROWTH: 1.05
  VALUE_LOSS_TYPE: "huber"
  VALUE_HUBER_DELTA: 10.0
  VALUE_TARGET_SCALE: 20.0
  EXPLAINED_VAR_VAR_FLOOR: 0.0001
  SKIP_NONFINITE_GRAD: true
  MIN_ROLLOUT_TRANSITIONS: 128
  SELF_PLAY_TEMPERATURE_START: 1.0
  SELF_PLAY_TEMPERATURE_END: 1.0
  SELF_PLAY_TEMPERATURE_DECAY_FRAC: 1.0
  PPO_ENTROPY_COEF_START: 0.003
  PPO_ENTROPY_COEF_END: 0.003
  PPO_ENTROPY_DECAY_FRAC: 1.0
  LEAGUE_RANDOM_OPPONENT_PROB: 0.0

  K_BEST: 8
  PFSP_BETA: 2.0
  SNAPSHOT_INTERVAL: 50

  LR: 0.0001
  GRAD_CLIP: 0.5
  GRAD_ACCUM_STEPS: 1
  AMP: false
  FULLGAME_CURRICULUM_ENABLE: true
  FULLGAME_CURRICULUM_PHASE1_END: 0.30
  FULLGAME_CURRICULUM_PHASE2_END: 0.70
  FULLGAME_CURRICULUM_MAX_RAISE_POT_MULT_P1: 1.0
  FULLGAME_CURRICULUM_MAX_RAISE_POT_MULT_P2: 2.5

  HIDDEN_DIM: 256
  NUM_LAYERS_CARD: 3
  NUM_LAYERS_ACTION: 2

  EVAL_FREQ: 50
  EVAL_EPISODES: 200
  EVAL_BASELINE_ALGO: "mccfr_external_sampling"
  EVAL_BASELINE_ITERS: 5000
  EVAL_BASELINE_SEEDS: 3
  EVAL_BASELINE_CACHE_MODE: "process"
  EVAL_BASELINE_LABEL: "MCCFR-ES"
  EVAL_CFR_ITERATIONS: 5000
  EVAL_ENABLE_RANDOM: true
  EVAL_ENABLE_CFR: false
  EVAL_ENABLE_NASH_CONV: false
  BEHAVIOR_GATE_ENABLE: true
  BEHAVIOR_GATE_MAX_FOLD_FREQ: 0.78
  BEHAVIOR_GATE_MAX_ALLIN_FREQ: 0.06
  BEHAVIOR_GATE_MIN_PRE_FLOP_ENTROPY_BITS: 0.75
  BEHAVIOR_GATE_MIN_CALL_CHECK_FREQ: 0.50
  BEHAVIOR_GATE_MIN_HALF_POT_FREQ: 0.01

  CHECKPOINT_FREQ: 50
  MAX_CHECKPOINTS: 10
  CHECKPOINT_SINGLE_FILE: false
  CHECKPOINT_SAVE_OPTIMIZER: true
  CHECKPOINT_SAVE_SCHEDULER: true
  CHECKPOINT_SAVE_LEAGUE: true
  CHECKPOINT_SAVE_EXTRA: true
  CHECKPOINT_SAVE_BEST_EVAL: true
  CHECKPOINT_BEST_EVAL_PATH: "checkpoints/best_eval.pt"
  LOG_INTERVAL: 5
  WANDB_MODE: "offline"
  WANDB_ENTITY: ""
  WANDB_TAGS: ""
  WANDB_REQUIRE_ONLINE: true
  ARCHIVE_ROOT: "artifacts/runs"
  OFFLINE_LOGGING: true

